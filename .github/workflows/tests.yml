name: tests

# Fast regression tests on every push. The full render check needs Chrome and
# lives in tools/smoke_test.py, run locally after changes to personas,
# threads, or the renderers.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Example profile
        run: cp -r profile.example profile
      - name: Regression tests
        run: python -m unittest discover tests -v
